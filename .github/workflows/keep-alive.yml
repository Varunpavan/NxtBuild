name: Keep Render Services Alive

# Pings the API Gateway health endpoint every 14 minutes between 6am–midnight IST (00:30–18:30 UTC).
# This keeps all 4 Render free-tier microservices warm so they never spin down during active hours.
# Cost: 100% free — GitHub Actions provides 2,000 free minutes/month for public repos.

on:
  schedule:
    # Every 14 minutes from 00:30 UTC to 18:30 UTC (06:00–00:00 IST)
    - cron: '*/14 0-18 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Render Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Wake up API Gateway + all downstream services
        run: |
          echo "Pinging NxtBuild API Gateway health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://nxtbuild-gateway.onrender.com/api/health)
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "All services are online and warm."
          else
            echo "Warning: Gateway returned HTTP $HTTP_STATUS — services may still be booting."
          fi
