services:
  # 1. Public API Gateway (Exposed to the web)
  - type: web
    name: nxtbuild-gateway
    env: docker
    dockerContext: server/gateway
    dockerfilePath: server/gateway/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5050
      - key: CLIENT_URL
        value: https://nxt-build-sepia.vercel.app
      - key: AUTH_SERVICE_URL
        value: https://nxtbuild-auth-service.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://nxtbuild-project-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://nxtbuild-ai-service.onrender.com

  # 2. Auth Service (Free Web Service)
  - type: web
    name: nxtbuild-auth-service
    env: docker
    dockerContext: server/services/auth
    dockerfilePath: server/services/auth/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

  # 3. Project Service (Free Web Service)
  - type: web
    name: nxtbuild-project-service
    env: docker
    dockerContext: server/services/projects
    dockerfilePath: server/services/projects/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8002
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_URL
        value: https://nxtbuild-auth-service.onrender.com

  # 4. AI Generation Service (Free Web Service)
  - type: web
    name: nxtbuild-ai-service
    env: docker
    dockerContext: server/services/ai
    dockerfilePath: server/services/ai/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8003
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AUTH_SERVICE_URL
        value: https://nxtbuild-auth-service.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://nxtbuild-project-service.onrender.com
